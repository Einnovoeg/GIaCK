# SwiftLint configuration for GIaCK
# Generated for 1.1 development - permissive to allow AI and per-bottle features

disabled_rules:
  - trailing_whitespace
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - large_tuple
  - force_cast
  - force_try
  - force_unwrapping
  - nesting
  - trailing_comma
  - for_where
  - identifier_name
  - vertical_whitespace
  - todo
  - void_return
  - redundant_discardable_let
  - colon
  - comma
  - mark

opt_in_rules: []

excluded:
  - GIACKKit/.build
  - .build

line_length:
  warning: 200
  error: 300
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 800
  error: 1500

type_body_length:
  warning: 500
  error: 800
